[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecuadata"
dynamic = ["version"]
description = "Datos públicos del Ecuador como DataFrames de pandas."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jaime Herrera" }]
keywords = ["ecuador", "datos abiertos", "open data", "pandas", "economia", "estadisticas", "bce", "inec"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/bernabecj/ec-public-data"
Issues = "https://github.com/bernabecj/ec-public-data/issues"

[tool.hatch.version]
path = "src/ecuadata/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ecuadata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --import-mode=importlib"
markers = ["live: hits the real data sources over the network (opt-in)"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
